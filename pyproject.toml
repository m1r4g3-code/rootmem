[project]
name = "rootmem"
version = "0.1.0"
description = "ROOTMEM — human-brain-inspired, MCP-native agent memory system"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.6.0",
    "asyncpg>=0.30",
    "mcp>=2.2",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pgvector>=0.5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "mypy>=1.13",
    "psycopg2-binary>=2.9.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "yoyo-migrations>=9.0",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires Docker (Postgres + Redis) to be running",
    "integration_external: calls a real external LLM API (Voyage/Anthropic) and costs money per run (ADR 0009/NFR6) — kept out of the default integration job, run separately/sparingly",
]
